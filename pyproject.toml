[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tropt"
version = "0.0.1a1"
description = "A toolbox for optimizing discrete text triggers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Matan Ben-Tov"}
]

# Core dependencies - minimal for basic HuggingFace model optimization
dependencies = [
  # Core ML/numeric libraries
  "torch>=2.4.0",
  "numpy>=2.0.0",
  "jaxtyping",
  # HuggingFace models (core use case)
  "transformers>=5.3.0",
  "accelerate>=1.0.0",
  "sentence-transformers>=5.1.0",
  # Data validation
  "pydantic>=2.0.0",
  # Configuration & utilities
  "hydra-core>=1.3.0",
  "omegaconf",
  "tqdm",
  "tenacity",
  "pandas>=2.3.3",
  "datasets>=4.8.3",
]

[project.urls]
Repository = "https://github.com/matanbt/tropt"
Issues = "https://github.com/matanbt/tropt/issues"

[project.optional-dependencies]
# API model integrations (install separately as needed)
openai = [
  "openai>=1.0.0",
  "tiktoken>=0.5.0",
]

google = [
  "google-genai>=1.0.0",
]

litellm = [
  "litellm>=1.0.0",
]

# Experiment tracking and visualization
tracking = [
  "wandb>=0.15.0",
  "livelossplot>=0.5.0",
]

# Jupyter notebook support
notebooks = [
  "ipython>=8.0.0",
  "jupyter>=1.0.0",
]

# All optional features (convenience installer)
all = []

# Development tools
dev = [
  # Testing
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",

  # Linting & formatting
  "ruff>=0.1.0",
  "pre-commit>=3.0.0",

  # All optional features for comprehensive testing
  "tropt[all]",
  "litellm[proxy]",

  # Analysis & visualization
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",

  # Documentation
  "sphinx>=5.0.0",
  "sphinx_rtd_theme>=1.0.0",
  "pydata_sphinx_theme>=0.13.0",
  "sphinx-autodoc-typehints>=1.20.0",
  "myst-parser>=0.18.0",
]

# Evaluation tools
evaluate = [
  "strong_reject @ git+https://github.com/dsbowen/strong_reject.git@main"
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tropt"]

[tool.ruff]
include = ["tropt/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Enable Pyflakes, pycodestyle, and isort rules
select = ["E", "F", "W", "I"]

ignore = [
    "E501",  # line length (currently ignored, TODO: re-format long lines)
    "F722",  # Forward annotation false positive from jaxtyping
    "F821",  # Undefined name false positive from jaxtyping
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # custom import order in init files 

[tool.ty.src]
include = ["tropt/"]

[tool.ty.rules]
unresolved-attribute = "ignore"   # HF/ST models expose attrs dynamically (e.g. .generate, .encode, .config)
invalid-argument-type = "ignore"  # jaxtyping annotations (Float[Tensor, ...]) confuse ty's type narrowing
call-non-callable = "ignore"      # ST's _first_module(), .encode(), HF's .generate() seen as Tensor|Module union
invalid-method-override = "ignore"  # model/loss subclasses intentionally specialize abstract signatures
invalid-assignment = "ignore"     # HF's apply_chat_template return type; copy.copy narrows to BaseModel

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_cuda: marks tests that require CUDA",
    "integration: marks integration tests across multiple pillars",
]
