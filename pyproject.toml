[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tropt"
version = "0.0.1a1"
description = "A toolbox for optimizing discrete text triggers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Matan Ben-Tov"}
]

dependencies = [
  "torch>=2.4.0",
  "tqdm",
  "jaxtyping",
  "numpy>=2.0.0",
  "transformers>=4.45.0",
  "accelerate>=1.0.0",
  "hydra-core>=1.3.0",
  "omegaconf",
  "sentence-transformers>=5.1.0",
  "wandb",
  "livelossplot",
  "openai",
  "litellm",
  "ipython",
  "tenacity",
]

[project.urls]
Repository = "https://github.com/matanbt/tropt"
Issues = "https://github.com/matanbt/tropt/issues"

[project.optional-dependencies]
dev = [
  # Testing:
  "pytest",
  "pytest-cov",
  "litellm[proxy]",

  # Linting:
  "ruff",
  "pre-commit",

  # Docs:
  "sphinx",
  "sphinx_rtd_theme",
  "pydata_sphinx_theme",
  "sphinx-autodoc-typehints",
]
# TODO the default pip should not install `evaluate` or `dev`

evaluate = [
  "strong_reject @ git+https://github.com/dsbowen/strong_reject.git@main"
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 88
ignore = [
    "F722", # Forward annotation false positive from jaxtyping
    "F821", # Undefined name false positive from jaxtyping
    "F401", # allow empty imports
]

[tool.ruff.lint]
# Enable Pyflakes, pycodestyle, and isort rules
select = ["E", "F", "W", "I"]

# Never enforce `E501` (line length), as `black` will handle that.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_cuda: marks tests that require CUDA",
    "integration: marks integration tests across multiple pillars",
]