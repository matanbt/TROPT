[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tropt"
version = "0.0.1a1"
description = "A toolbox for optimizing discrete text triggers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Matan Ben-Tov"}
]

# Core dependencies - minimal for basic HuggingFace model optimization
dependencies = [
  # Core ML/numeric libraries
  "torch>=2.4.0",
  "numpy>=2.0.0",
  "jaxtyping",

  # HuggingFace models (core use case)
  "transformers>=4.45.0",
  "accelerate>=1.0.0",
  "sentence-transformers>=5.1.0",

  # Configuration & utilities
  "hydra-core>=1.3.0",
  "omegaconf",
  "tqdm",
  "tenacity",
]

[project.urls]
Repository = "https://github.com/matanbt/tropt"
Issues = "https://github.com/matanbt/tropt/issues"

[project.optional-dependencies]
# API model integrations (install separately as needed)
openai = [
  "openai>=1.0.0",
  "tiktoken>=0.5.0",
]

google = [
  "google-generativeai>=0.3.0",
]

litellm = [
  "litellm>=1.0.0",
]

# Experiment tracking and visualization
tracking = [
  "wandb>=0.15.0",
  "livelossplot>=0.5.0",
]

# Jupyter notebook support
notebooks = [
  "ipython>=8.0.0",
  "jupyter>=1.0.0",
]

# All optional features (convenience installer)
all = [
  "tropt[openai]",
  "tropt[google]",
  "tropt[litellm]",
  "tropt[tracking]",
  "tropt[notebooks]",
]

# Development tools
dev = [
  # Testing
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",

  # Linting & formatting
  "ruff>=0.1.0",
  "pre-commit>=3.0.0",

  # All optional features for comprehensive testing
  "tropt[all]",
  "litellm[proxy]",

  # Documentation
  "sphinx>=5.0.0",
  "sphinx_rtd_theme>=1.0.0",
  "pydata_sphinx_theme>=0.13.0",
  "sphinx-autodoc-typehints>=1.20.0",
]

# Evaluation tools
evaluate = [
  "strong_reject @ git+https://github.com/dsbowen/strong_reject.git@main"
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 88
ignore = [
    "F722", # Forward annotation false positive from jaxtyping
    "F821", # Undefined name false positive from jaxtyping
    "F401", # allow empty imports
]

[tool.ruff.lint]
# Enable Pyflakes, pycodestyle, and isort rules
select = ["E", "F", "W", "I"]

# Never enforce `E501` (line length), as `black` will handle that.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_cuda: marks tests that require CUDA",
    "integration: marks integration tests across multiple pillars",
]