[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
ignore = [
    "F722", # Forward annotation false positive from jaxtyping
    "F821", # Undefined name false positive from jaxtyping
    "F401", # allow empty imports
]

[tool.ruff.lint]
# Enable Pyflakes, pycodestyle, and isort rules
select = ["E", "F", "W", "I"]

# Never enforce `E501` (line length), as `black` will handle that.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ttop"]
