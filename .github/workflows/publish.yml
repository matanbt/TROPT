name: Publish to PyPI

# Publishes when a GitHub Release is published:
#   Releases → Draft a new release → tag e.g. v0.1.0 → write notes → Publish.
# Tag the release to match pyproject.toml's version (that's the version that
# actually gets published). workflow_dispatch is a manual fallback.
# Requires PyPI Trusted Publishing configured at pypi.org (no API key needed).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tropt
    # Required for PyPI Trusted Publishing (OIDC — no API token needed).
    # Set up at: https://pypi.org/manage/project/tropt/settings/publishing/
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
