<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" width="740" height="180" role="img" aria-label="TROPT — Textual Trigger Optimization Toolbox">
  <title>TROPT</title>
  <desc>Textual Trigger Optimization Toolbox</desc>

  <defs>
    <linearGradient id="tropt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Mark: { [ ][ ][ ] } — placeholder braces framing discrete tokens, middle = optimized -->
  <g transform="translate(28, 24)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brace { -->
    <path d="M 60 4
             C 32 4, 28 14, 28 36
             L 28 56
             C 28 68, 18 68, 6 68
             C 18 68, 28 68, 28 80
             L 28 100
             C 28 122, 32 132, 60 132"
          stroke="url(#tropt-grad)" stroke-width="6.5"/>

    <!-- Three discrete-token tiles; middle is the optimized trigger -->
    <rect x="70"  y="50" width="30" height="32" rx="5.5" stroke="#64748B" stroke-width="2.4"/>
    <rect x="110" y="50" width="30" height="32" rx="5.5" fill="url(#tropt-grad)"/>
    <rect x="150" y="50" width="30" height="32" rx="5.5" stroke="#64748B" stroke-width="2.4"/>

    <!-- Right brace } -->
    <path d="M 190 4
             C 218 4, 222 14, 222 36
             L 222 56
             C 222 68, 232 68, 244 68
             C 232 68, 222 68, 222 80
             L 222 100
             C 222 122, 218 132, 190 132"
          stroke="url(#tropt-grad)" stroke-width="6.5"/>
  </g>

  <!-- Wordmark -->
  <text x="305" y="112"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="100"
        font-weight="800"
        fill="#7C3AED"
        letter-spacing="-2">TROPT</text>

  <!-- Tagline -->
  <text x="308" y="144"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13.5"
        font-weight="500"
        fill="#64748B"
        letter-spacing="3.5">TEXTUAL TRIGGER OPTIMIZATION TOOLBOX</text>
</svg>
