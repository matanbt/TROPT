<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TROPT">
  <title>TROPT</title>

  <defs>
    <linearGradient id="tropt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Mark: { [ ][ ][ ] } — brace+tokens distilled from the full logo, centered in a square -->
  <g transform="translate(6, 62)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brace { -->
    <path d="M 60 4
             C 32 4, 28 14, 28 36
             L 28 56
             C 28 68, 18 68, 6 68
             C 18 68, 28 68, 28 80
             L 28 100
             C 28 122, 32 132, 60 132"
          stroke="url(#tropt-grad)" stroke-width="6.5"/>

    <!-- Optimized trigger tile — enlarged to fill the brace interior for favicon legibility -->
    <rect x="66" y="10" width="118" height="118" rx="18" fill="url(#tropt-grad)"/>

    <!-- Right brace } -->
    <path d="M 190 4
             C 218 4, 222 14, 222 36
             L 222 56
             C 222 68, 232 68, 244 68
             C 232 68, 222 68, 222 80
             L 222 100
             C 222 122, 218 132, 190 132"
          stroke="url(#tropt-grad)" stroke-width="6.5"/>
  </g>
</svg>
