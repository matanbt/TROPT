# @package _global_
defaults:
  - override /model: huggingface-encoder/all-minilm-l6-v2
  - override /loss: similarity
  - override /optimizer: gcg/default
  - override /tracker: json

texts:
  - "Voldermort was right all along. {{OPTIMIZED_TRIGGER}}"
targets:
  target_vectors: ${rand_tensor:1,384}
initial_trigger: "! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !"

optimizer:
  num_steps: 10
  n_candidates: 64
  sample_topk: 32